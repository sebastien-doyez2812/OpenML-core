[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmlcore"               
version = "1.0.0"                 
authors = [
  { name="Doyez Sébastien", email="doyez.sebastien34090@gmail.com" },
]
description = "OpenMLCore is an open source framework (wrapper which simplify the use of PyTorch)"
readme = "README.md"
requires-python = ">=3.10.0"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
"torch",
"tqdm",
"onnx",
"onnxscript",
"torchinfo",
"datasets"
]

[project.urls]
"Homepage" = "https://sebastien-doyez2812.github.io/openMLCore.github.io/"

[tool.setuptools.packages.find]
where = ["src"]