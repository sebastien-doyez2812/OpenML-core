[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openml"
version = "0.1.0"
dependencies = [
    "torch",
    "pytest",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings[python]"
]

[tool.setuptools.packages.find]
where = ["src"]